<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));setTimeout(function(){window.msgs.innerHTML="Menginstal Cache Offline: " + Percent + "%";},500)}
function DisplayCacheProgress(){setTimeout(function(){window.msgs.innerHTML="Cache Berhasil Diinstal ✔";},1500);setTimeout(function(){window.msgs.innerHTML="Sekarang tutup dan buka kembali browser Anda ...";},3500);}window.applicationCache.addEventListener("progress",DLProgress,false);window.applicationCache.oncached=function(e){DisplayCacheProgress();};window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
</script>
<h1>PS4 GoldHEN Firmware 9.00</h1>
